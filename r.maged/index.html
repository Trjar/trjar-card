:root{color-scheme:light;--blue:#1f4790;--orange:#f36f21;--paper:#fff;--ink:#14243f;--muted:#5d6b82;--line:#e3e8f0;--tint:#eef2f9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:transparent;color:var(--ink);font-family:'DejaVu Sans',Verdana,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px 12px}
.card{width:100%;max-width:420px;background:var(--paper);border-radius:24px;overflow:hidden;align-self:flex-start;border:1px solid var(--line);box-shadow:0 6px 24px rgba(31,71,144,.12)}
.head{background:transparent;color:var(--blue);padding:0 20px 12px;text-align:center}
.brand{background:transparent;padding:20px 20px 8px;text-align:center}
.brand img{display:block;margin:0 auto;width:170px;max-width:65%;height:auto}
h1{margin:0;font-size:22px;font-weight:700;color:var(--blue)}
.role{margin:2px 0 0;font-size:15px;color:var(--orange);font-weight:600}
.co{margin:0 0 6px;font-size:13px;color:var(--muted);line-height:1.5;font-weight:600}
.save .ic{width:20px;height:20px}
.save{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 40px);margin:10px 20px 8px;padding:12px;border:0;border-radius:12px;background:var(--orange);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.save:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 20px 2px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-size:12px;font-weight:700}
.act.wa{background:#25D366}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
.act:focus-visible,.row:focus-visible,.soc:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.list{padding:2px 20px 2px}
.row{display:flex;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.row:last-child{border-bottom:0}
.bub{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;flex:none}
.row small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.row b{display:block;font-weight:700;font-size:13.5px;overflow-wrap:anywhere;line-height:1.4}
.socials{display:flex;justify-content:center;gap:10px;padding:8px 20px 2px}
.soc{width:52px;height:52px;display:block;border-radius:14px}
.soc svg{width:52px;height:52px;display:block}
.soc.g0{border-radius:50%}
.soc.g{border-radius:50%;box-shadow:0 0 0 1px var(--line)}
#note a{color:var(--blue);font-weight:700}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:0 20px 12px;margin:0}
</style>

function e(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function row(icon,label,val,href){return '<a class="row" href="'+e(href)+'" target="_blank" rel="noopener"><span class="bub">'+icon+'</span><span><small>'+e(label)+'</small><b>'+e(val)+'</b></span></a>'}
var h='<div class="brand"><img src="'+LOGO+'" alt="Trjar logo"></div><header class="head"><p class="co">'+e(C.company)+'</p><h1>'+e(C.name)+'</h1><p class="role">'+e(C.role)+'</p></header>';
h+='<nav class="actions"><a class="act" href="tel:'+e(C.phone)+'">'+I.phone+'Call</a><a class="act" href="mailto:'+e(C.email)+'">'+I.mail+'Email</a></nav>';
h+='<section class="list">'+row(I.phone,'Mobile',C.phone,'tel:'+C.phone)+row(I.mail,'Email',C.email,'mailto:'+C.email)+row(I.globe,'Website',C.website.replace(/^https?:\/\//,''),C.website);
C.branches.forEach(function(x){h+=row(I.pin,x.label,x.text,x.url)});
h+='</section><div class="socials"><a class="soc g0" href="https://wa.me/'+e(C.whatsapp)+'" target="_blank" rel="noopener" aria-label="WhatsApp">'+I.wa2+'</a><a class="soc" href="'+e(C.facebook)+'" target="_blank" rel="noopener" aria-label="Facebook">'+I.fb+'</a><a class="soc" href="'+e(C.instagram)+'" target="_blank" rel="noopener" aria-label="Instagram">'+I.ig+'</a><a class="soc g" href="'+e(C.review)+'" target="_blank" rel="noopener" aria-label="Rate us on Google" title="Rate us on Google">'+I.google+'</a><a class="soc" href="mailto:'+e(C.info)+'" aria-label="Email us" title="Email us">'+I.mailus+'</a></div>';
h+='<button type="button" class="save" id="save">'+I.user+'Save contact</button><p class="foot" id="note">Tap the number to save it to your contacts</p>';
document.getElementById('card').innerHTML=h;
var VFILE=null;
try{fetch('/r.maged/rawan-maged.vcf').then(function(r){return r.blob();}).then(function(b){VFILE=new File([b],'rawan-maged.vcf',{type:'text/vcard'});}).catch(function(){});}catch(e){}
function go(u){window.location.href=u;}
document.getElementById('save').addEventListener('click',function(){
  var f='/r.maged/rawan-maged.vcf';
  var ua=navigator.userAgent;
  var android=/Android/i.test(ua);
  var ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var n=document.getElementById('note');
  if(ios){go(f);return;}
  if(android){
    if(VFILE&&navigator.canShare&&navigator.canShare({files:[VFILE]})){
      navigator.share({files:[VFILE],title:C.name}).catch(function(err){
        if(err&&err.name==='AbortError'){return;}
        go(f);
      });
      return;
    }
    go(f);
    if(n){n.textContent='Contact file downloaded: tap Open, then Save to add it to your contacts.';}
    return;
  }
  var a=document.createElement('a');a.href=f;a.download='rawan-maged.vcf';document.body.appendChild(a);a.click();a.remove();
  var body=['Name: '+C.name,'Title: '+C.role,'Company: '+C.company,'Mobile: '+C.phone,'Email: '+C.email,'Trjar: '+C.info,'Website: '+C.website,'Card: '+window.location.href].join('\r\n');
  var m='mailto:?subject='+encodeURIComponent('Contact: '+C.name+' - Trjar')+'&body='+encodeURIComponent(body);
  if(n){n.innerHTML='Contact file downloaded: open it to add it to Outlook or Apple Contacts. Or <a href="'+m+'">email this contact to yourself</a>.';}
});
